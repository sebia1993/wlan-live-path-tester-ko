name: Local Report CI

on:
  push:
    branches:
      - main
    paths:
      - "src/WlanLivePathTester.Core/Reporting/**"
      - "src/WlanLivePathTester.App/MainWindow.Report.cs"
      - "tests/WlanLivePathTester.ReportSmoke/**"
      - ".github/workflows/report-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/WlanLivePathTester.Core/Reporting/**"
      - "src/WlanLivePathTester.App/MainWindow.Report.cs"
      - "tests/WlanLivePathTester.ReportSmoke/**"
      - ".github/workflows/report-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-report-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-smoke:
    name: report-smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore report smoke project
        run: dotnet restore .\tests\WlanLivePathTester.ReportSmoke\WlanLivePathTester.ReportSmoke.csproj

      - name: Build report smoke project
        run: dotnet build .\tests\WlanLivePathTester.ReportSmoke\WlanLivePathTester.ReportSmoke.csproj -c Release --no-restore

      - name: Run report smoke test
        run: dotnet run --project .\tests\WlanLivePathTester.ReportSmoke\WlanLivePathTester.ReportSmoke.csproj -c Release --no-build
