name: Windows CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\WlanLivePathTester.sln

      - name: Build
        run: dotnet build .\WlanLivePathTester.sln -c Release --no-restore

      - name: Run deterministic self-test
        run: dotnet run --project .\tests\WlanLivePathTester.SelfTest\WlanLivePathTester.SelfTest.csproj -c Release --no-build

      - name: Audit repository
        shell: powershell
        run: .\scripts\audit-repository.ps1

      - name: Audit network boundary
        shell: powershell
        run: .\scripts\audit-network-boundary.ps1

      - name: Publish smoke test
        run: >
          dotnet publish .\src\WlanLivePathTester.App\WlanLivePathTester.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o .\artifacts\publish
