name: Windows CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\WlanLivePathTester.sln

      - name: Build
        run: dotnet build .\WlanLivePathTester.sln -c Release --no-restore

      - name: Run deterministic self-test
        run: dotnet run --project .\tests\WlanLivePathTester.SelfTest\WlanLivePathTester.SelfTest.csproj -c Release --no-build

      - name: Run Windows WLAN API smoke test
        run: dotnet run --project .\tests\WlanLivePathTester.WindowsSmoke\WlanLivePathTester.WindowsSmoke.csproj -c Release --no-build

      - name: Run WinHTTP proxy authentication smoke test
        run: dotnet run --project .\tests\WlanLivePathTester.ProxyAuthSmoke\WlanLivePathTester.ProxyAuthSmoke.csproj -c Release --no-build

      - name: Run download measurement smoke test
        run: dotnet run --project .\tests\WlanLivePathTester.MeasurementSmoke\WlanLivePathTester.MeasurementSmoke.csproj -c Release --no-build

      - name: Audit repository
        shell: powershell
        run: .\scripts\audit-repository.ps1

      - name: Audit network boundary
        shell: powershell
        run: .\scripts\audit-network-boundary.ps1

      - name: Publish smoke test
        run: >
          dotnet publish .\src\WlanLivePathTester.App\WlanLivePathTester.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o .\artifacts\publish
