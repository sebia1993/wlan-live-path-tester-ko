name: Release Package CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/RELEASE_*.md"
      - "WlanLivePathTester.sln"
      - "Directory.Build.*"
      - "global.json"
      - ".github/workflows/release-package-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: package-smoke
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify source and all smoke tests
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\verify-release.ps1
          -Configuration Release

      - name: Build Windows release packages
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Version 0.0.0-ci
          -OutputRoot .\artifacts\release

      - name: Validate release packages
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\test-release-package.ps1
          -Version 0.0.0-ci
          -OutputRoot .\artifacts\release

      - name: Show verified asset inventory
        shell: powershell
        run: >-
          Get-ChildItem -LiteralPath .\artifacts\release -File |
          Sort-Object Name |
          Select-Object Name, Length, LastWriteTime
