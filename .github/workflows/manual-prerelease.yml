name: Manual Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New prerelease tag, for example v0.1.0-alpha.10"
        required: true
        default: "v0.1.0-alpha.10"
        type: string

permissions:
  contents: write

concurrency:
  group: manual-prerelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: verify-build-publish-reverify
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      DISPATCH_REF: ${{ github.ref }}
      DISPATCH_SHA: ${{ github.sha }}

    steps:
      - name: Checkout dispatched main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate main prerelease request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ($env:DISPATCH_REF -ne 'refs/heads/main') {
              throw "Manual prerelease must be dispatched from main. Ref=$env:DISPATCH_REF"
          }

          $tag = $env:REQUESTED_TAG.Trim()
          $pattern = '^v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))$'
          $match = [regex]::Match(
              $tag,
              $pattern,
              [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if (-not $match.Success) {
              throw "Manual prerelease requires a strict prerelease SemVer tag such as v0.1.0-alpha.10: $tag"
          }

          $version = $match.Groups['version'].Value
          $prerelease = $version.Substring($version.IndexOf('-') + 1)
          foreach ($identifier in $prerelease.Split('.')) {
              $isNumeric = $identifier -match '^\d+$'
              $hasLeadingZero = $identifier.Length -gt 1 `
                  -and $identifier.StartsWith(
                      '0',
                      [StringComparison]::Ordinal)
              if ($isNumeric -and $hasLeadingZero) {
                  throw "Numeric prerelease identifiers cannot contain leading zeroes: $tag"
              }
          }

          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to determine the checked-out commit.'
          }
          if ([string]::IsNullOrWhiteSpace($headSha)) {
              throw 'The checked-out commit SHA is empty.'
          }
          if (-not $headSha.Equals(
              $env:DISPATCH_SHA,
              [StringComparison]::OrdinalIgnoreCase)) {
              throw "Checkout SHA does not match the workflow dispatch SHA. Checkout=$headSha Dispatch=$env:DISPATCH_SHA"
          }

          $notesPath = Join-Path `
              (Get-Location) `
              "docs\RELEASE_NOTES_$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
              throw "Version-specific release notes not found: $notesPath"
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_COMMIT_SHA=$headSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tag=$tag Version=$version Commit=$headSha Notes=$notesPath" -ForegroundColor Green

      - name: Check tag and release state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $tagJson = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" 2>$null
          $tagExitCode = $LASTEXITCODE
          if ($tagExitCode -eq 0) {
              $tagRef = $tagJson | ConvertFrom-Json
              $tagSha = [string]$tagRef.object.sha
              if (-not $tagSha.Equals(
                  $env:RELEASE_COMMIT_SHA,
                  [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Tag $env:RELEASE_TAG already points to a different object: $tagSha"
              }

              'TAG_ALREADY_EXISTS=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Existing tag points to the verified commit: $tagSha"
          }
          elseif ($tagExitCode -eq 1) {
              'TAG_ALREADY_EXISTS=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host 'Tag does not exist and will be created after local verification.'
          }
          else {
              throw "Unable to inspect tag state. gh exit code: $tagExitCode"
          }

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExitCode = $LASTEXITCODE
          if ($releaseExitCode -eq 0) {
              throw "A GitHub Release already exists for $env:RELEASE_TAG. Existing releases are never overwritten."
          }
          if ($releaseExitCode -ne 1) {
              throw "Unable to inspect Release state. gh exit code: $releaseExitCode"
          }

          Write-Host 'No existing Release was found.' -ForegroundColor Green
          exit 0

      - name: Verify source and all smoke tests
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\verify-release.ps1
          -Configuration Release

      - name: Build prerelease assets
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Version $env:RELEASE_VERSION
          -OutputRoot .\artifacts\release

      - name: Validate release package
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\test-release-package.ps1
          -Version $env:RELEASE_VERSION
          -OutputRoot .\artifacts\release

      - name: Validate observation documents in local Portable ZIP
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\test-observation-guides-package.ps1
          -PortableZip .\artifacts\release\WlanLivePathTester-win-x64-portable.zip

      - name: Verify exact local release asset set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = @(Get-ChildItem -LiteralPath .\artifacts\release -File |
              Select-Object -ExpandProperty Name |
              Sort-Object)
          $expected = @(
              'SHA256SUMS.txt',
              'THIRD_PARTY_NOTICES.md',
              'WlanLivePathTester-win-x64-portable.zip',
              'WlanLivePathTester-win-x64-single-file.exe'
          ) | Sort-Object
          if (($actual -join '|') -ne ($expected -join '|')) {
              throw "Release output must contain exactly four assets. Actual: $($actual -join ', ')"
          }

          foreach ($name in $expected) {
              $path = Join-Path .\artifacts\release $name
              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Local release asset is empty: $name"
              }
          }
          Write-Host 'Exact four-file local release set verified.' -ForegroundColor Green

      - name: Create lightweight tag at verified commit
        if: env.TAG_ALREADY_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f "ref=refs/tags/$env:RELEASE_TAG" `
              -f "sha=$env:RELEASE_COMMIT_SHA"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to create tag $env:RELEASE_TAG."
          }

          $created = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if (-not ([string]$created.object.sha).Equals(
              $env:RELEASE_COMMIT_SHA,
              [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Created tag does not point to the verified commit.'
          }

      - name: Create verified draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
              '.\artifacts\release\WlanLivePathTester-win-x64-portable.zip',
              '.\artifacts\release\WlanLivePathTester-win-x64-single-file.exe',
              '.\artifacts\release\SHA256SUMS.txt',
              '.\artifacts\release\THIRD_PARTY_NOTICES.md'
          )
          gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --draft `
              --prerelease `
              --title "WLAN Live Path Tester KO $env:RELEASE_TAG" `
              --notes-file $env:RELEASE_NOTES_PATH `
              @assets
          if ($LASTEXITCODE -ne 0) {
              throw 'Draft prerelease creation or asset upload failed.'
          }

      - name: Verify draft asset names
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to read the draft prerelease.'
          }
          if (-not $release.isDraft -or -not $release.isPrerelease) {
              throw 'Release must remain a draft prerelease during verification.'
          }

          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @(
              'SHA256SUMS.txt',
              'THIRD_PARTY_NOTICES.md',
              'WlanLivePathTester-win-x64-portable.zip',
              'WlanLivePathTester-win-x64-single-file.exe'
          ) | Sort-Object
          if (($names -join '|') -ne ($expected -join '|')) {
              throw "Unexpected draft assets: $($names -join ', ')"
          }
          Write-Host 'Draft prerelease asset names verified.' -ForegroundColor Green

      - name: Publish verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --draft=false `
              --prerelease
          if ($LASTEXITCODE -ne 0) {
              throw 'Publishing the verified prerelease failed.'
          }

      - name: Download published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDirectory = Join-Path `
              $env:RUNNER_TEMP `
              'published-release-assets'
          if (Test-Path -LiteralPath $downloadDirectory) {
              Remove-Item -LiteralPath $downloadDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $downloadDirectory -Force |
              Out-Null

          gh release download $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to download published prerelease assets.'
          }

          "PUBLISHED_ASSET_DIRECTORY=$downloadDirectory" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Reverify downloaded assets and SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = $env:PUBLISHED_ASSET_DIRECTORY
          $actual = @(Get-ChildItem -LiteralPath $directory -File |
              Select-Object -ExpandProperty Name |
              Sort-Object)
          $expected = @(
              'SHA256SUMS.txt',
              'THIRD_PARTY_NOTICES.md',
              'WlanLivePathTester-win-x64-portable.zip',
              'WlanLivePathTester-win-x64-single-file.exe'
          ) | Sort-Object
          if (($actual -join '|') -ne ($expected -join '|')) {
              throw "Unexpected downloaded assets: $($actual -join ', ')"
          }

          foreach ($name in $expected) {
              $localPath = Join-Path .\artifacts\release $name
              $downloadedPath = Join-Path $directory $name
              $localHash = (Get-FileHash `
                  -LiteralPath $localPath `
                  -Algorithm SHA256).Hash.ToLowerInvariant()
              $downloadedHash = (Get-FileHash `
                  -LiteralPath $downloadedPath `
                  -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($localHash -ne $downloadedHash) {
                  throw "Published asset differs from the locally verified asset: $name"
              }
          }

          $checksumPath = Join-Path $directory 'SHA256SUMS.txt'
          $lines = @(Get-Content -LiteralPath $checksumPath |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 3) {
              throw 'Downloaded SHA256SUMS.txt must contain exactly three hashes.'
          }

          $expectedHashes = @{}
          foreach ($line in $lines) {
              $match = [regex]::Match(
                  $line,
                  '^(?<hash>[0-9a-f]{64})  (?<name>[^\\/]+)$',
                  [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
              if (-not $match.Success) {
                  throw "Invalid downloaded checksum line: $line"
              }

              $name = $match.Groups['name'].Value
              if ($expectedHashes.ContainsKey($name)) {
                  throw "Duplicate downloaded checksum entry: $name"
              }
              $expectedHashes[$name] = $match.Groups['hash'].Value
          }

          $hashedAssets = @(
              'WlanLivePathTester-win-x64-portable.zip',
              'WlanLivePathTester-win-x64-single-file.exe',
              'THIRD_PARTY_NOTICES.md'
          )
          foreach ($name in $hashedAssets) {
              if (-not $expectedHashes.ContainsKey($name)) {
                  throw "Downloaded checksum is missing: $name"
              }
              $actualHash = (Get-FileHash `
                  -LiteralPath (Join-Path $directory $name) `
                  -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $expectedHashes[$name]) {
                  throw "Downloaded asset checksum mismatch: $name"
              }
          }

          $release = gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to read the published prerelease.'
          }
          if ($release.isDraft -or -not $release.isPrerelease) {
              throw 'Published release state is incorrect.'
          }
          $publishedNames = @($release.assets |
              ForEach-Object { $_.name } |
              Sort-Object)
          if (($publishedNames -join '|') -ne ($expected -join '|')) {
              throw "Unexpected published asset metadata: $($publishedNames -join ', ')"
          }

          "RELEASE_URL=$($release.url)" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append
          Write-Host "Published asset bytes and checksums verified: $($release.url)" -ForegroundColor Green

      - name: Reverify downloaded Portable ZIP documents and build revision
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path `
              $env:PUBLISHED_ASSET_DIRECTORY `
              'WlanLivePathTester-win-x64-portable.zip'

          powershell -NoProfile -ExecutionPolicy Bypass `
              -File .\scripts\test-observation-guides-package.ps1 `
              -PortableZip $zip
          if ($LASTEXITCODE -ne 0) {
              throw 'Downloaded Portable ZIP observation document validation failed.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
              $buildInfoEntry = $null
              foreach ($entry in $archive.Entries) {
                  $normalizedName = $entry.FullName.Replace('\', '/')
                  if ($normalizedName -eq 'BUILD_INFO.txt') {
                      $buildInfoEntry = $entry
                      break
                  }
              }
              if ($null -eq $buildInfoEntry) {
                  throw 'Downloaded Portable ZIP is missing BUILD_INFO.txt.'
              }

              $reader = New-Object System.IO.StreamReader(
                  $buildInfoEntry.Open())
              try {
                  $buildInfo = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }
          }
          finally {
              $archive.Dispose()
          }

          if (-not $buildInfo.Contains("Version=$env:RELEASE_VERSION")) {
              throw 'Downloaded BUILD_INFO.txt version does not match the release version.'
          }
          if (-not $buildInfo.Contains("SourceRevision=$env:RELEASE_COMMIT_SHA")) {
              throw 'Downloaded BUILD_INFO.txt source revision does not match the verified commit.'
          }
          Write-Host 'Downloaded Portable ZIP documents and BUILD_INFO verified.' -ForegroundColor Green

      - name: Verify published tag target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" |
              ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to read the published tag.'
          }
          if (-not ([string]$tag.object.sha).Equals(
              $env:RELEASE_COMMIT_SHA,
              [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Published tag does not point to the verified commit.'
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Published prerelease verified

          - Tag: `$env:RELEASE_TAG`
          - Commit: `$env:RELEASE_COMMIT_SHA`
          - Release: $env:RELEASE_URL
          - Assets: exactly four
          - Published bytes: match locally verified files
          - SHA-256: verified from downloaded `SHA256SUMS.txt`
          - Portable ZIP documents: verified
          - BUILD_INFO version and source revision: verified
          "@
          Write-Host "Verified tag $env:RELEASE_TAG -> $env:RELEASE_COMMIT_SHA" -ForegroundColor Green
